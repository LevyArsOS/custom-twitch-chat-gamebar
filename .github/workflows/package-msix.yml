name: Package MSIX

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-msix:
    name: package-msix
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Sync web assets
        shell: bash
        run: ./scripts/sync-web-assets --check
      - name: Run core tests
        run: dotnet test CustomTwitchChat.GameBar.sln -c Release --nologo
      - name: Build UWP MSIX package
        shell: pwsh
        run: .\scripts\package-msix.ps1 -Configuration Release -Platform x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: custom-twitch-chat-gamebar-msix-x64
          path: AppPackages/**/*
