name: Package MSIX

on:
  pull_request:
  push:
    branches: [main, develop]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-msix:
    name: package-msix
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Sync web assets
        shell: bash
        run: ./scripts/sync-web-assets --check
      - name: Run core tests
        run: dotnet test CustomTwitchChat.GameBar.sln -c Release --nologo
      - name: Build signed end-user MSIX bundle
        shell: pwsh
        env:
          MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: .\scripts\build-release-msix.ps1 -Configuration Release -Platform x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: custom-twitch-chat-gamebar-release-x64
          path: |
            AppPackages/CustomTwitchChat.GameBar-*.zip
            AppPackages/Release/*.msix

  attach-release-assets:
    name: attach-release-assets
    needs: package-msix
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: custom-twitch-chat-gamebar-release-x64
          path: release-assets
      - name: Upload MSIX bundle to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            release-assets/*.zip \
            release-assets/Release/*.msix \
            --repo "${{ github.repository }}" \
            --clobber
